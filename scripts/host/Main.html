<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feed Window</title><link rel="stylesheet" href="../Style.css"><script src="../Script.js" defer></script></head>
<body><main>
  <img src="../Icon.png" width="64" height="64" alt=""><div class="eyebrow">FEED WINDOW</div>
  <h1>スクロールに、<br>小さな区切りを。</h1>
  <p>XのおすすめとInstagramリールを、<br>それぞれ1回5分・1日3回だけ。時間と回数は変更できます。</p>
  <p class="state-unknown status">Safariで拡張機能を有効にしてください。</p>
  <p class="state-on status">拡張機能は有効です。X・Instagramへのアクセスも許可してください。</p>
  <p class="state-off status">拡張機能はオフです。Safariの設定で有効にしてください。</p>
  <button class="open-preferences">Safariの拡張機能設定を開く</button>
  <p class="note">開発版：設定 → 詳細 →「Webデベロッパ用の機能を表示」<br>→ デベロッパ →「署名されていない拡張機能を許可」<br>→ 拡張機能 → Feed Windowをオン<br>※ Safariを終了した後は、署名なしの許可を再度設定します。</p>
</main></body></html>
